plugins { id 'com.android.application' }
android {
    namespace 'com.flyingcomputer.gndfull'
    compileSdk 35
    ndkVersion '27.2.12479018'
    signingConfigs {
        // Pinned debug key so CI/local APKs can `adb install -r` without wiping EdgeTX SD.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId 'com.flyingcomputer.gndfull'
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName '0.1.29-cli'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions'
                // Required for 16 KB page devices (Android 15+ / Play policy).
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
